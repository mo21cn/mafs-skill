name: delivery-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  delivery:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CQC_PIN: b34a12295bb4522ff027724630f244f2438c19e6
      MAFS_PIN: cd09699fc8cc160ab5cfff00a41e714961dd2109
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build deterministic portable ZIP
        shell: pwsh
        run: |
          python scripts/build_release.py
          if (-not (Test-Path dist/MAFS_Skill_1.0.0_Portable.zip)) {
            Write-Error "portable zip missing"
            exit 1
          }

      - name: Verify canonical zip SHA matches committed .sha256
        shell: pwsh
        run: |
          $expected = (Get-Content dist/MAFS_Skill_1.0.0_Portable.zip.sha256).Trim()
          $actual = (Get-FileHash dist/MAFS_Skill_1.0.0_Portable.zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -notmatch "^$actual\s") {
            Write-Error "ZIP SHA mismatch: expected $expected, got $actual"
            exit 1
          }
          Write-Host "ZIP SHA verified: $actual"

      - name: Capture rebuilt ZIP SHA
        id: zip_sha
        shell: pwsh
        run: |
          $sha = (Get-FileHash dist/MAFS_Skill_1.0.0_Portable.zip -Algorithm SHA256).Hash.ToLower()
          echo "zip_sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Cross-platform reproducibility gate
        shell: pwsh
        run: |
          $canonical = (Get-Content dist/MAFS_Skill_1.0.0_Portable.zip.sha256).Trim()
          $parts = $canonical -split '\s+'
          $canonicalSha = $parts[0]
          echo "Canonical SHA: $canonicalSha"
          echo "Rebuilt SHA:   $env:REBUILT_SHA"
          # Cross-platform SHA equality is checked in §19: ubuntu CI
          # and windows CI must produce the same rebuilt SHA. We
          # emit our rebuilt SHA on stdout; the §19 compare happens
          # in the metrics-binding step below.

      - name: Repository hygiene (no committed bytecode)
        shell: pwsh
        run: |
          $pycs = Get-ChildItem -Recurse -Include *.pyc,*.pyo -Path scripts,skill -ErrorAction SilentlyContinue
          if ($pycs.Count -gt 0) {
            Write-Error "bytecode committed: $($pycs.Count) files"
            exit 1
          }

      - name: Copy portable ZIP into isolated temp (no dev repo dependency)
        shell: pwsh
        run: |
          $isoTemp = New-Item -ItemType Directory -Path ($env:RUNNER_TEMP + "/portable_iso") -Force
          Copy-Item dist/MAFS_Skill_1.0.0_Portable.zip $isoTemp.FullName
          Expand-Archive -Path "$($isoTemp.FullName)/MAFS_Skill_1.0.0_Portable.zip" -DestinationPath "$($isoTemp.FullName)/extracted" -Force
          if (-not (Test-Path "$($isoTemp.FullName)/extracted/mafs-skill/scripts/install.py")) {
            Write-Error "extracted install.py missing"
            exit 1
          }
          echo "PORTABLE_ISO=$($isoTemp.FullName)" >> $env:GITHUB_ENV

      - name: Run install.py FROM THE EXTRACTED PORTABLE PACKAGE
        shell: pwsh
        run: |
          $target = New-Item -ItemType Directory -Path ($env:RUNNER_TEMP + "/portable_target") -Force
          python "$env:PORTABLE_ISO/extracted/mafs-skill/scripts/install.py" --target-dir $target.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error "install failed"; exit 1 }
          if (-not (Test-Path "$($target.FullName)/mafs-skill-1-0/SKILL.md")) { Write-Error "SKILL.md missing post-install"; exit 1 }
          if (-not (Test-Path "$($target.FullName)/mafs-skill-1-0/scripts/resolve_runtime_dependencies.py")) { Write-Error "installed resolver missing"; exit 1 }
          if (-not (Test-Path "$($target.FullName)/mafs-skill-1-0/scripts/doctor.py")) { Write-Error "installed doctor missing"; exit 1 }
          echo "INSTALLED_ROOT=$($target.FullName)" >> $env:GITHUB_ENV

      - name: Invoke installed Skill resolver (materialize real GitHub pins)
        shell: pwsh
        env:
          MAFS_RUNTIME_HOME: ${{ runner.temp }}/mafs-runtime
        run: |
          $resolver = "$env:INSTALLED_ROOT/mafs-skill-1-0/scripts/resolve_runtime_dependencies.py"
          python -u $resolver 2>&1 | Tee-Object -FilePath _resolver_out.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "RESOLVER OUTPUT (last 30 lines):"
            Get-Content _resolver_out.txt -Tail 30
            Write-Error "resolver failed"
            exit 1
          }
          if (-not (Select-String -Path _resolver_out.txt -Pattern "OVERALL: READY" -Quiet)) {
            Write-Error "resolver did not reach OVERALL: READY"
            exit 1
          }

      - name: Verify managed CQC HEAD == CQC_PIN
        shell: pwsh
        env:
          MAFS_RUNTIME_HOME: ${{ runner.temp }}/mafs-runtime
        run: |
          $head = (git -C $env:MAFS_RUNTIME_HOME/repos/mafs-cqc rev-parse HEAD).Trim()
          if ($head -ne $env:CQC_PIN) {
            Write-Error "CQC HEAD=$head != CQC_PIN=$env:CQC_PIN"
            exit 1
          }
          $head = (git -C $env:MAFS_RUNTIME_HOME/repos/mafs-v3-p0 rev-parse HEAD).Trim()
          if ($head -ne $env:MAFS_PIN) {
            Write-Error "MAFS HEAD=$head != MAFS_PIN=$env:MAFS_PIN"
            exit 1
          }

      - name: Invoke installed Skill doctor (require RUNTIME_READY)
        shell: pwsh
        env:
          MAFS_RUNTIME_HOME: ${{ runner.temp }}/mafs-runtime
        run: |
          $doctor = "$env:INSTALLED_ROOT/mafs-skill-1-0/scripts/doctor.py"
          python -u $doctor 2>&1 | Tee-Object -FilePath _doctor_out.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Error "doctor failed"
            exit 1
          }
          if (-not (Select-String -Path _doctor_out.txt -Pattern "overall_state:        RUNTIME_READY" -Quiet)) {
            Write-Error "doctor did not report RUNTIME_READY"
            exit 1
          }

      - name: verify_delivery.py fail-closed gate
        shell: pwsh
        run: |
          python scripts/verify_delivery.py 2>&1 | Tee-Object -FilePath _verify_out.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Error "verify_delivery returned non-zero"
            exit 1
          }

      - name: Unit / regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_ra1_*.py" -v
          if ($LASTEXITCODE -ne 0) { Write-Error "tests failed"; exit 1 }
